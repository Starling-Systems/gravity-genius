<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Gravity Genius | Play</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link href="/static/css/game.css" rel="stylesheet" />
    <script src="/static/js/gravity.js" defer></script>
  </head>
  <body>
    <main class="game-shell">
      <header>
        <div class="title-row">
          <a href="/" class="home-link" aria-label="Back to homepage">
            <img src="/static/img/einstein_8bit.png" alt="" class="home-icon" />
          </a>
          <h1>Gravity Genius</h1>
        </div>
        <p class="hint">Tilt your phone to steer through the gravity field.</p>
      </header>

      <section id="buttons" aria-label="Game controls">
        <button id="start">Start</button>
        <button id="pause">Pause</button>
        <button id="reset">Reset</button>
        <button id="motion">Enable Tilt</button>
        <label class="debug-label"
          ><input type="checkbox" id="debug" value="false" />Debug</label
        >
      </section>

      <section id="status-bar" aria-live="polite">Tilt status: pending</section>

      <section id="canvas-wrap">
        <canvas id="myCanvas"></canvas>
      </section>

      <footer>Avoid the black hole. Survive as long as possible.</footer>
    </main>
  </body>
</html>
