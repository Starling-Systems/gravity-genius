<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gravity Genius | Retro Space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link href="/static/css/home.css" rel="stylesheet" />
  </head>
  <body>
    <main class="home-shell">
      <section class="hero-card" aria-label="Gravity Genius landing panel">
        <p class="eyebrow">Classic Arcade Experiment</p>
        <h1>Gravity Genius</h1>
        <p class="subtitle">
          Guide the mass through a chaotic gravity well using your phone tilt.
          Stay alive. Find orbit. Beat your best time.
        </p>
        <a class="play-button" href="/play">Launch Game</a>
      </section>

      <section class="bust-panel" aria-label="Retro Einstein bust artwork">
        <div class="halo"></div>
        <img
          class="einstein-bust-image"
          src="/static/img/einstein_8bit.png"
          alt="Retro Einstein bust"
        />
      </section>
    </main>
  </body>
</html>
